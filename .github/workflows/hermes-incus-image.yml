name: Hermes Incus image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Incus image name and GitHub release asset prefix.
        required: true
        default: hermes
      release:
        description: Ubuntu release used for the Incus image rootfs.
        required: true
        default: noble
      architecture:
        description: Incus image architecture metadata.
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
      publish_release:
        description: Publish image files to a GitHub Release.
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Hermes image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE_NAME: ${{ inputs.image_name || 'hermes' }}
      RELEASE: ${{ inputs.release || 'noble' }}
      ARCHITECTURE: ${{ inputs.architecture || 'x86_64' }}
      HERMES_GIT_REF: ${{ github.sha }}
      INCUS_HOST: ${{ secrets.INCUS_HOST }}
      INCUS_USER: ${{ secrets.INCUS_USER }}
      INCUS_SSH_KEY: ${{ secrets.INCUS_SSH_KEY }}
      INCUS_PROJECT: ${{ vars.INCUS_PROJECT || 'default' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Incus image files
        run: |
          set -euo pipefail

          if [[ "${IMAGE_NAME}" == *aziendaos* ]]; then
            echo "IMAGE_NAME must stay product-neutral; got ${IMAGE_NAME}" >&2
            exit 2
          fi

          BUILD_DIR="/tmp/hermes-incus-image"
          ROOTFS_DIR="${BUILD_DIR}/rootfs"
          META_DIR="${BUILD_DIR}/metadata"
          TEMPLATE_DIR="${META_DIR}/templates"
          EXPORT_DIR="dist/incus"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${ROOTFS_DIR}" "${META_DIR}" "${TEMPLATE_DIR}" "${EXPORT_DIR}"

          sudo apt-get update
          sudo apt-get install -y \
            mmdebstrap \
            rsync \
            squashfs-tools \
            xz-utils \
            tar \
            python3 \
            python3-venv \
            python3-pip

          sudo mmdebstrap \
            --variant=minbase \
            --architectures=amd64 \
            --components=main,universe \
            --include=systemd-sysv,dbus,cloud-init,ca-certificates,curl,git,jq,build-essential,python3,python3-pip,python3-venv,ffmpeg,tesseract-ocr,tesseract-ocr-ita,libtesseract-dev,libleptonica-dev \
            "${RELEASE}" \
            "${ROOTFS_DIR}" \
            "http://archive.ubuntu.com/ubuntu"

          sudo mkdir -p "${ROOTFS_DIR}/opt/hermes-agent/src" "${ROOTFS_DIR}/etc/hermes-agent" "${ROOTFS_DIR}/etc/systemd/system/multi-user.target.wants"
          sudo rsync -a --delete --exclude .git ./ "${ROOTFS_DIR}/opt/hermes-agent/src/"

          sudo chroot "${ROOTFS_DIR}" /bin/bash -lc '
          set -euo pipefail
          python3 -m venv /opt/hermes-agent/venv
          /opt/hermes-agent/venv/bin/pip install --upgrade pip
          /opt/hermes-agent/venv/bin/pip install --no-cache-dir -e /opt/hermes-agent/src "aiohttp>=3.13.3,<4" "markitdown[all]"
          '

          sudo tee "${ROOTFS_DIR}/etc/hermes-agent/config.yaml" >/dev/null <<'YAML'
          platforms:
            api_server:
              enabled: true
              host: 0.0.0.0
              port: 8642
              key: ${API_SERVER_KEY}
          YAML

          sudo tee "${ROOTFS_DIR}/etc/hermes-agent/.env" >/dev/null <<'ENV'
          API_SERVER_KEY=CHANGE_ME_AT_PROVISIONING
          HERMES_API_KEY=CHANGE_ME_AT_PROVISIONING
          OPENAI_API_KEY=CHANGE_ME_AT_PROVISIONING
          ENV
          sudo chmod 0600 "${ROOTFS_DIR}/etc/hermes-agent/.env"

          sudo mkdir -p "${ROOTFS_DIR}/etc/cloud/cloud.cfg.d"
          sudo tee "${ROOTFS_DIR}/etc/cloud/cloud.cfg.d/90-incus-datasource.cfg" >/dev/null <<'YAML'
          datasource_list: [ NoCloud, LXD, None ]
          YAML

          sudo tee "${ROOTFS_DIR}/etc/systemd/system/hermes-gateway.service" >/dev/null <<'UNIT'
          [Unit]
          Description=Hermes Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          Environment=HERMES_HOME=/etc/hermes-agent
          EnvironmentFile=/etc/hermes-agent/.env
          ExecStart=/opt/hermes-agent/venv/bin/hermes gateway run
          Restart=always
          RestartSec=5
          WorkingDirectory=/etc/hermes-agent

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo ln -sf /etc/systemd/system/hermes-gateway.service "${ROOTFS_DIR}/etc/systemd/system/multi-user.target.wants/hermes-gateway.service"
          sudo rm -rf "${ROOTFS_DIR}/tmp/"* "${ROOTFS_DIR}/var/tmp/"* "${ROOTFS_DIR}/root/.cache" "${ROOTFS_DIR}/var/lib/apt/lists/"* "${ROOTFS_DIR}/var/lib/cloud"
          sudo find "${ROOTFS_DIR}/var/log" -type f -exec truncate -s 0 {} + || true

          cat >"${TEMPLATE_DIR}/meta-data.tpl" <<'TPL'
          instance-id: {{ instance.name }}
          local-hostname: {{ instance.name }}
          TPL

          cat >"${TEMPLATE_DIR}/user-data.tpl" <<'TPL'
          {{ config_get("cloud-init.user-data", config_get("user.user-data", "#cloud-config")) }}
          TPL

          cat >"${TEMPLATE_DIR}/vendor-data.tpl" <<'TPL'
          {{ config_get("cloud-init.vendor-data", config_get("user.vendor-data", "#cloud-config")) }}
          TPL

          cat >"${TEMPLATE_DIR}/network-config.tpl" <<'TPL'
          {{ config_get("cloud-init.network-config", config_get("user.network-config", "{version: 2, ethernets: {eth0: {dhcp4: true, dhcp6: false}}}")) }}
          TPL

          if grep -R '\\n' "${TEMPLATE_DIR}"; then
            echo "Incus metadata templates must not contain literal \\\\n escapes." >&2
            exit 2
          fi

          cat >"${META_DIR}/metadata.yaml" <<YAML
          architecture: "${ARCHITECTURE}"
          creation_date: $(date +%s)
          properties:
            description: "${IMAGE_NAME} Hermes runtime ${HERMES_GIT_REF}"
            os: "Ubuntu"
            release: "${RELEASE}"
            variant: "default"
            serial: "${HERMES_GIT_REF}"
          templates:
            /var/lib/cloud/seed/nocloud-net/meta-data:
              when:
                - create
                - copy
              template: meta-data.tpl
              create_only: true
            /var/lib/cloud/seed/nocloud-net/user-data:
              when:
                - create
                - copy
              template: user-data.tpl
              create_only: true
            /var/lib/cloud/seed/nocloud-net/vendor-data:
              when:
                - create
                - copy
              template: vendor-data.tpl
              create_only: true
            /var/lib/cloud/seed/nocloud-net/network-config:
              when:
                - create
                - copy
              template: network-config.tpl
              create_only: true
          YAML

          sudo tar -C "${META_DIR}" -cJf "${EXPORT_DIR}/incus.tar.xz" metadata.yaml templates
          sudo mksquashfs "${ROOTFS_DIR}" "${EXPORT_DIR}/rootfs.squashfs" -noappend -comp xz
          sudo chown "$(id -u):$(id -g)" "${EXPORT_DIR}/incus.tar.xz" "${EXPORT_DIR}/rootfs.squashfs"

          sha256sum "${EXPORT_DIR}/incus.tar.xz" "${EXPORT_DIR}/rootfs.squashfs" >"${EXPORT_DIR}/SHA256SUMS"

          cat >"${EXPORT_DIR}/IMPORT.md" <<EOF
          # Import ${IMAGE_NAME}

          \`\`\`bash
          incus image import incus.tar.xz rootfs.squashfs --alias ${IMAGE_NAME} --alias ${IMAGE_NAME}-${HERMES_GIT_REF}
          \`\`\`
          EOF

          echo "Built Incus image files in ${EXPORT_DIR}:"
          ls -lh "${EXPORT_DIR}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.sha }}-incus
          path: dist/incus/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.IMAGE_NAME }}-${{ github.sha }}
          name: ${{ env.IMAGE_NAME }} ${{ github.sha }}
          files: dist/incus/*
          make_latest: false

      - name: Import image on production Incus host
        if: ${{ env.INCUS_HOST != '' && env.INCUS_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$INCUS_SSH_KEY" > ~/.ssh/incus_key
          chmod 600 ~/.ssh/incus_key
          SSH_USER="${INCUS_USER:-root}"
          REMOTE_DIR="/tmp/${IMAGE_NAME}-${HERMES_GIT_REF}-incus"
          ssh -i ~/.ssh/incus_key -o StrictHostKeyChecking=no "${SSH_USER}@${INCUS_HOST}" "rm -rf '${REMOTE_DIR}' && mkdir -p '${REMOTE_DIR}'"
          scp -i ~/.ssh/incus_key -o StrictHostKeyChecking=no dist/incus/incus.tar.xz dist/incus/rootfs.squashfs "${SSH_USER}@${INCUS_HOST}:${REMOTE_DIR}/"
          ssh -i ~/.ssh/incus_key -o StrictHostKeyChecking=no "${SSH_USER}@${INCUS_HOST}" \
            "incus image alias delete '${IMAGE_NAME}' --project '${INCUS_PROJECT}' >/dev/null 2>&1 || true; \
             incus image alias delete '${IMAGE_NAME}-${HERMES_GIT_REF}' --project '${INCUS_PROJECT}' >/dev/null 2>&1 || true; \
             incus image import '${REMOTE_DIR}/incus.tar.xz' '${REMOTE_DIR}/rootfs.squashfs' --project '${INCUS_PROJECT}' --alias '${IMAGE_NAME}' --alias '${IMAGE_NAME}-${HERMES_GIT_REF}'; \
             incus image list '${IMAGE_NAME}' --project '${INCUS_PROJECT}'; \
             rm -rf '${REMOTE_DIR}'"
